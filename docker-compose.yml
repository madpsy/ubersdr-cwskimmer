services:
    cwskimmer:
        build: .
        image: madpsy/ubersdr-cwskimmer:latest
        container_name: cwskimmer
        privileged: true
        init: true  # Enable tini init to reap zombie processes from background watchers
        
        environment:
            # Station Configuration
            - CALLSIGN=${CALLSIGN:-N0CALL}
            - NAME=${NAME:-John}
            - QTH=${QTH:-Dalgety Bay}
            - SQUARE=${SQUARE:-IO86ha}

            # UberSDR Configuration
            - UBERSDR_HOST=${UBERSDR_HOST:-ubersdr}
            - UBERSDR_PORT=${UBERSDR_PORT:-8080}

            # Frequency Calibration
            - FREQ_CALIBRATION=${FREQ_CALIBRATION:-1}

            # Callsign Validation
            - MIN_QUALITY=${MIN_QUALITY:-1}

            # Sample Rate (96 or 192)
            - SAMPLE_RATE=${SAMPLE_RATE:-192}

            # Service Control
            - CWSKIMM_ENABLED=${CWSKIMM_ENABLED:-true}

            # RTTY Skimmer Server
            - RTTYSKIRMSRV_ENABLED=${RTTYSKIRMSRV_ENABLED:-false}
            - RTTYSKIRMSRV_PORT=${RTTYSKIRMSRV_PORT:-7400}

            # RTTY Band Selection
            - RTTY_BAND_160M=${RTTY_BAND_160M:-false}
            - RTTY_BAND_80M=${RTTY_BAND_80M:-false}
            - RTTY_BAND_60M=${RTTY_BAND_60M:-false}
            - RTTY_BAND_40M=${RTTY_BAND_40M:-true}
            - RTTY_BAND_30M=${RTTY_BAND_30M:-false}
            - RTTY_BAND_20M=${RTTY_BAND_20M:-true}
            - RTTY_BAND_17M=${RTTY_BAND_17M:-false}
            - RTTY_BAND_15M=${RTTY_BAND_15M:-false}
            - RTTY_BAND_12M=${RTTY_BAND_12M:-false}
            - RTTY_BAND_10M=${RTTY_BAND_10M:-false}
            - RTTY_BAND_10M_HIGH=${RTTY_BAND_10M_HIGH:-false}

            # RTTY Validation Level
            - RTTY_VALIDATION_LEVEL=${RTTY_VALIDATION_LEVEL:-2}

            # License Export (exports Armadillo license blobs back to ./licenses/ after GUI registration)
            # Disable this if you don't want the trial state re-imported on every restart
            - LICENSE_EXPORT_ENABLED=${LICENSE_EXPORT_ENABLED:-false}

            # RBN Spot Submission
            - RBN_SEND_SPOTS=${RBN_SEND_SPOTS:-true}

            # Band Selection
            - BAND_160M=${BAND_160M:-true}
            - BAND_80M=${BAND_80M:-true}
            - BAND_60M=${BAND_60M:-true}
            - BAND_40M=${BAND_40M:-true}
            - BAND_30M=${BAND_30M:-true}
            - BAND_20M=${BAND_20M:-true}
            - BAND_17M=${BAND_17M:-true}
            - BAND_15M=${BAND_15M:-true}
            - BAND_12M=${BAND_12M:-true}
            - BAND_10M=${BAND_10M:-true}
            - BAND_10M_BEACONS=${BAND_10M_BEACONS:-true}
        
        ports:
            - "7550:7550"

        # Join the ka9q_ubersdr network for direct container communication
        networks:
            - sdr-network

        healthcheck:
            test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/7300' || exit 1"]
            interval: 30s
            timeout: 10s
            start_period: 60s
            retries: 3

        volumes:
            # Shared volume for restart trigger
            - restart-trigger:/var/run/restart-trigger
            # SkimSrv license files (Armadillo registry blobs exported from a licensed Windows install)
            # Place any .reg files in the licenses/ directory and they will all be imported into Wine on startup
            # rw so the container can export a license back to this directory after GUI registration
            - ./licenses:/tmp/skimsrv_licenses:rw
        logging:
          driver: "fluentd"
          options:
            fluentd-address: "127.0.0.1:24224"
            fluentd-async: "true"
            tag: "cwskimmer"


        restart: unless-stopped
        cpu_shares: 768

# Join the external sdr-network created by ka9q_ubersdr stack
networks:
    sdr-network:
        external: true
        name: ubersdr_sdr-network

# Named volumes for persistent storage
volumes:
    restart-trigger:
        driver: local
